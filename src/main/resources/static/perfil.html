<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu perfil - Colheita Compartilhada</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#principal">Ir para o conteúdo</a>
  <header id="topo"></header>
  <main id="principal" class="conteudo">
    <div class="cartao cartao--larga">
      <h1>Meu perfil</h1>
      <p class="cartao__intro">Para publicar anúncios, cadastre seu WhatsApp e autorize a divulgação do contato.</p>
      <div id="mensagem-erro" class="mensagem" role="alert"></div>
      <div id="mensagem-ok" class="mensagem" aria-live="polite"></div>
      <form id="form" novalidate hidden>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name" maxlength="120" required aria-describedby="erro-nome">
          <span id="erro-nome" class="erro"></span>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" readonly aria-describedby="dica-email">
          <p id="dica-email" class="dica">O e-mail não pode ser alterado.</p>
        </div>
        <div class="campo">
          <fieldset aria-describedby="erro-tipo">
            <legend>Você é</legend>
            <div class="opcoes">
              <label class="opcao"><input type="radio" name="tipo" value="MORADOR"> Morador</label>
              <label class="opcao"><input type="radio" name="tipo" value="PEQUENO_PRODUTOR"> Pequeno produtor</label>
            </div>
          </fieldset>
          <span id="erro-tipo" class="erro"></span>
        </div>
        <div class="campo">
          <label for="whatsapp">WhatsApp (com DDD)</label>
          <input type="tel" id="whatsapp" name="whatsapp" autocomplete="tel-national" inputmode="numeric" placeholder="(00) 00000-0000" maxlength="15" aria-describedby="dica-whatsapp erro-whatsapp">
          <p id="dica-whatsapp" class="dica">Deixe em branco para remover o número.</p>
          <span id="erro-whatsapp" class="erro"></span>
        </div>
        <div class="campo">
          <label class="opcao opcao--check"><input type="checkbox" id="aceiteContato" name="aceiteContato" aria-describedby="aviso-aceite"> Autorizo mostrar meu WhatsApp a usuários logados interessados nos meus anúncios</label>
          <p id="aviso-aceite" class="nota-info" aria-live="polite" hidden></p>
        </div>
        <div class="acoes-form">
          <button class="botao" type="submit" id="enviar">Salvar</button>
        </div>
      </form>
    </div>
  </main>
  <footer id="rodape"></footer>
  <script type="module" src="js/paginas/perfil.js"></script>
</body>
</html>
